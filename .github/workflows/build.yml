name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: Install deps
      run: sudo apt-get install dos2unix ninja-build

    - name: Install dosemu
      run: |
        git clone https://github.com/sozud/dosemu-deb.git
        cd dosemu-deb
        sudo apt-get install xfonts-utils
        sudo dpkg -i fdpp_1.6-1_amd64.deb
        sudo dpkg -i fdpp-dev_1.6-1_amd64.deb
        sudo dpkg -i comcom32_0.1~alpha3-1_all.deb
        sudo dpkg -i dosemu2_2.0~pre9-1_amd64.deb

    - name: Build
      run: |
        cargo build --release --manifest-path ./tools/psy-q-splitter/splitter/Cargo.toml
        sh prep_33.sh
        sh prep_35.sh
        sh prep_36.sh
        sh prep_40.sh
        python3 build.py
        ninja -j1

    - name: Progress
      run: ninja -j1 progress

    - name: Upload progress report (3.3)
      uses: actions/upload-artifact@v4
      with:
        name: 3.3_report
        path: build/3.3/report.json

    - name: Upload progress report (3.5)
      uses: actions/upload-artifact@v4
      with:
        name: 3.5_report
        path: build/3.5/report.json

    - name: Upload progress report (3.6)
      uses: actions/upload-artifact@v4
      with:
        name: 3.6_report
        path: build/3.6/report.json

    - name: Upload progress report (4.0)
      uses: actions/upload-artifact@v4
      with:
        name: 4.0_report
        path: build/4.0/report.json
